grammar: FHIRConnect/v0.9.0
type: model
metadata:
  name:  CLUSTER.dosage.v2
  version: 0.0.1-alpha 
spec: 
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.dosage.v2
    revision: 2.0.2
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Dosage

mappings:
  - name: "dosageInstructionText"
    with:
      fhir: "$fhirRoot.text"
      openehr: "$archetype/items[at0178]"
      
  - name: "doseQuantityValue"
    with:
      fhir: "$fhirRoot.doseAndRate.dose.as(Quantity)"
      openehr: "$archetype/items[at0144]"
      
  - name: "sequence"
    with:
      fhir: "$fhirRoot.sequence"
      openehr: "$archetype/items[at0164]"

  - name: "rateQuantity"
    with:
      fhir: "$fhirRoot.doseAndRate.rate.as(Quantity)"
      openehr: "$archetype/items[at0134]"

  - name: "dosageDailyTiming"
    with:
      fhir: "$fhirRoot"
      openehr: "$archetype/items[openEHR-EHR-CLUSTER.timing_daily.v1]"
    slotArchetype: "CLUSTER.timing_daily.v1"
    fhirCondition:
      targetRoot: "$fhirRoot"
      targetAttribute: "timing.repeat.periodUnit"
      operator: "one of"
      criteria: "[s, min, h, d]"


  - name: "dosageTimingNonDaily"
    with:
      fhir: "$fhirRoot"
      openehr: "$archetype/items[openEHR-EHR-CLUSTER.timing_nondaily.v1]"
    slotArchetype: "CLUSTER.timing_nondaily.v1"
    fhirCondition:
      targetRoot: "$fhirRoot"
      targetAttribute: "timing.repeat.periodUnit"
      operator: "not of"
      criteria: "[s, min, h, d]"

  - name: "doseRangeValue"
    with:
      fhir: "$fhirRoot.doseAndRate.dose.as(Range)"
      openehr: "$archetype/items[at0144]"
    mappingCode: "dosageQuantityToRange"

  - name: "rateRatio"
    with:
      fhir: "$fhirRoot.doseAndRate.rate.as(Ratio)"
      openehr: "$archetype" # maps at0134 and at0102
    mappingCode: "ratio_to_dosage"

  - name: "rateRangeValue"
    with:
      fhir: "$fhirRoot.doseAndRate.rate.as(Range)"
      openehr: "$archetype/items[at0134]"
    mappingCode: "rangeToText"

  - name: "duration"
    with:
       fhir: "$fhirRoot.timing.repeat"
       openehr: "$archetype/items[at0102]"
    mappingCode: "dosageDurationToAdministrationDuration"
